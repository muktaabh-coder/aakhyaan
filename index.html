<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>आख्यान</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Nirmala UI,sans-serif;
    background:#f8f5ef;
    color:#222;
}

/* Header */

header{
    background:#5b2c06;
    color:#fff;
    text-align:center;
    padding:18px 20px;
}

header h1{
    font-size:56px;
    font-weight:700;
    line-height:1.1;
}

header p{
    margin-top:8px;
    font-size:18px;
    opacity:.95;
}

/* Navigation */

nav{
    background:#8b4513;
    text-align:center;
    padding:12px 0;
}

nav a{
    color:#fff;
    text-decoration:none;
    margin:0 18px;
    font-size:18px;
    transition:.3s;
}

nav a:hover{
    color:#ffd9a0;
}

/* Hero */

.hero{
    padding:70px 20px;
    text-align:center;
}

.hero h2{
    font-size:48px;
    color:#5b2c06;
    margin-bottom:25px;
}

.hero p{
    max-width:900px;
    margin:auto;
    font-size:24px;
    line-height:1.8;
}

.btn{
    display:inline-block;
    margin-top:35px;
    padding:15px 35px;
    background:#5b2c06;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-size:18px;
    transition:.3s;
}

.btn:hover{
    background:#7a3d0c;
}

/* Footer */

footer{
    margin-top:80px;
    background:#222;
    color:#fff;
    text-align:center;
    padding:25px;
    font-size:16px;
}

</style>

</head>

<body>

<header>

<h1>आख्यान</h1>

<p>साहित्य • समालोचना • संस्कृति • शोध</p>

</header>

<nav>

<a href="#">मुखपृष्ठ</a>

<a href="#">कहानियाँ</a>

<a href="#">कविताएँ</a>

<a href="#">समालोचना</a>

<a href="#">शोध</a>

<a href="#">संपर्क</a>

</nav>

<section class="hero">

<h2>आख्यान में आपका स्वागत है</h2>

<p>
कुछ शब्दचित्र हैं यहाँ। विकास की अन्धी दौड़ में ये हाशिये की आख्याएँ हैं और आख्यान भी!
</p>

<a class="btn" href="#">पढ़ना प्रारम्भ करें</a>

</section>

<footer>

© 2026 आख्यान

</footer>

</body>
</html>
